<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courseify - Live Tech Jobs & Insights India</title>
  <meta name="description" content="Verified tech job openings and daily market insights for Indian IT professionals." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: transform 0.2s; }
    .glass-card:hover { transform: translateY(-4px); border-color: #6366f1; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2); }
  </style>
</head>
<body>
  <header class="bg-white shadow-sm py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="font-extrabold text-xl text-indigo-600">Courseify.</div>
      <nav class="space-x-6 text-sm font-semibold text-slate-600">
        <a href="#jobs" class="hover:text-indigo-600">Jobs</a>
        <a href="insights.html" class="hover:text-indigo-600">Market Insights</a>
      </nav>
    </div>
  </header>

  <section class="py-20 text-center px-4">
    <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-4">Supercharge Your Career</h1>
    <p class="text-slate-500 text-lg max-w-2xl mx-auto mb-8">Data-driven market insights and verified live job postings to help you land your next big role in tech.</p>
  </section>

  <section class="max-w-4xl mx-auto px-4 mb-16">
    <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-8" id="latest-insight-container">
      <p class="text-slate-500">Loading today's market insight...</p>
    </div>
  </section>

  <section id="jobs" class="max-w-6xl mx-auto px-4 pb-24">
    <div class="flex justify-between items-end mb-8">
      <h2 class="text-3xl font-bold">Live Opportunities</h2>
      <span class="text-sm font-semibold text-slate-500" id="job-count">Loading...</span>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="job-grid">
      </div>
  </section>

  <script>
    // Fetch and display latest jobs
    fetch('data/latest_jobs.json')
      .then(response => response.json())
      .then(jobs => {
        document.getElementById('job-count').textContent = `${jobs.length} Jobs Live`;
        const grid = document.getElementById('job-grid');
        grid.innerHTML = jobs.map(job => `
          <div class="glass-card p-6 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-lg leading-tight">${job.title}</h3>
                <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded">NEW</span>
              </div>
              <p class="text-slate-500 text-sm mb-4">${job.company} · ${job.location}</p>
              <div class="flex gap-2 mb-4">
                <span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded">${job.type}</span>
                <span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-1 rounded">${job.salary}</span>
              </div>
            </div>
            <a href="${job.apply_link}" target="_blank" class="block w-full text-center bg-slate-900 text-white font-semibold py-2 rounded-lg hover:bg-indigo-600 transition">Apply Now</a>
          </div>
        `).join('');
      });

    // Fetch and display latest insight
    fetch('data/insights.json')
      .then(response => response.json())
      .then(insights => {
        if(insights.length > 0) {
          const latest = insights[0]; // Get the newest one
          document.getElementById('latest-insight-container').innerHTML = `
            <div class="text-xs font-bold text-indigo-600 mb-2 tracking-widest uppercase">Daily Market Insight</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-3">${latest.title}</h3>
            <p class="text-slate-600 mb-4">${latest.excerpt}</p>
            <a href="insights.html" class="text-indigo-600 font-semibold hover:underline">Read Full Analysis &rarr;</a>
          `;
        }
      });
  </script>
</body>
</html>

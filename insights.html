<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Market Insights | Courseify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }</style>
</head>
<body>
  <header class="bg-white shadow-sm py-4 px-6 mb-12">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-extrabold text-xl text-indigo-600">Courseify.</a>
      <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">&larr; Back to Jobs</a>
    </div>insla
  </header>

  <main class="max-w-3xl mx-auto px-4 pb-20">
    <h1 class="text-4xl font-extrabold mb-8">Daily Market Insights</h1>
    <div id="insights-feed" class="space-y-12">
      <p class="text-slate-500">Loading insights...</p>
    </div>
  </main>

  <script>
    fetch('data/insights.json')
      .then(response => response.json())
      .then(insights => {
        const feed = document.getElementById('insights-feed');
        feed.innerHTML = insights.map(post => `
          <article class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <div class="text-sm text-slate-400 font-semibold mb-2">${post.date}</div>
            <h2 class="text-2xl font-bold mb-4 text-slate-900">${post.title}</h2>
            <div class="prose prose-slate max-w-none text-slate-600">
              ${post.content.split('\n').map(p => `<p class="mb-4">${p}</p>`).join('')}
            </div>
            <div class="mt-6 pt-6 border-t border-slate-100 flex gap-2">
               ${post.tags.map(tag => `<span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded-full">#${tag}</span>`).join('')}
            </div>
          </article>
        `).join('');
      });
  </script>
</body>
</html>
